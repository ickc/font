# Pinned to a commit, not to `main`: the hashes below are fixed, so any upstream
# commit touching either font or the licence would make every install fail with
# no mirror to fall back on. This commit carries the Sans2.004 font files and the
# SIL OFL 1.1 relicensing. Nothing is staged: browsers get Noto Sans TC from
# Google Fonts.
[fonts.noto-cjk-tc]
description = "Noto Sans CJK TC, Regular and Bold (SIL OFL 1.1); browser output uses Google Fonts"
downloads = [
  { name = "NotoSansCJKtc-Regular.otf", sha256 = "dce08bd4fd91aa8aa76ed8fea4b694c2dfb8550f67871e326843212ddbeb88b4", urls = [
    "https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf",
  ] },
  { name = "NotoSansCJKtc-Bold.otf", sha256 = "3ee160e5015106e3ec1a394301df54fa9bbbf8a251519984aec5c0abc50840c0", urls = [
