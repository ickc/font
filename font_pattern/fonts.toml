# SIL ships this face as WOFF, the only one of the staged faces without a WOFF2
# alongside it. Every browser that can render the site reads WOFF2, and
# recompressing the official web build into it takes about a quarter off the
# transfer -- the same tables in a smaller container, which is the step the TeX
# Gyre faces already go through from OTF.
[fonts.ezra-sil]
description = "Ezra SIL 2.51, with its official web font recompressed to WOFF2 (SIL OFL 1.1)"
downloads = [
  { name = "EzraSIL-2.51-web.zip", sha256 = "7c19544c173c91e6ac47f605dae2cfa7e61e428abdafe27cf3f225fec4406357", urls = [
    "https://software.sil.org/downloads/r/ezra/EzraSIL-2.51-web.zip",
  ] },
]
install = [
  "EzraSIL-2.51-web.zip!EzraSIL-2.51-web/SILEOT.ttf",
  { from = "EzraSIL-2.51-web.zip!EzraSIL-2.51-web/Licenses.txt", as = "EzraSIL-Licenses.txt" },
]
stage = [
  { from = "EzraSIL-2.51-web.zip!EzraSIL-2.51-web/web/SILEOT.woff", as = "SILEOT.woff2" },
  { from = "EzraSIL-2.51-web.zip!EzraSIL-2.51-web/Licenses.txt", as = "EzraSIL-Licenses.txt" },
]

