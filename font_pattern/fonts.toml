# Every font this repository can install, pinned. `font-pattern list` prints them.
#
# Each font names the files to download -- every one checked against its SHA-256,
# with mirrors tried in order -- and then what to do with them:
#
#   install   copied into the desktop font directory (`--dir`), where Typst,
#             LuaLaTeX and desktop applications find them.
#   stage     copied into the browser font directory (`--web-dir`), and only when
#             one is given. A target ending in .woff2 from a source that is not
#             WOFF2 is recompressed into it with fontTools.
#
# An entry is either a downloaded file's name, or `archive.zip!member/path` for a
# file inside a downloaded zip. A string keeps the file's own name; a table
# `{ from = ..., as = ... }` renames it.
#
# A font's licence is installed and staged beside it, because the licences these
# fonts come under require the text to travel with the files.

[fonts.tex-gyre-schola]
description = "TeX Gyre Schola, from CTAN (GUST Font License)"
downloads = [
  { name = "GUST-FONT-LICENSE.txt", sha256 = "2bd69affc3da00715116f713f57eab9707e96daf3562ad0215987b15b9c16f73", urls = [
    "https://mirrors.ctan.org/fonts/tex-gyre/doc/GUST-FONT-LICENSE.txt",
    "https://tex.org.uk/fonts/tex-gyre/doc/GUST-FONT-LICENSE.txt",
  ] },
  { name = "texgyreschola-regular.otf", sha256 = "935b82e25f56b1d1276ca82793205e8ce254fbb37ebd38bedf7388cef21fbf44", urls = [
    "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreschola-regular.otf",
    "https://tex.org.uk/fonts/tex-gyre/opentype/texgyreschola-regular.otf",
  ] },
  { name = "texgyreschola-bold.otf", sha256 = "988c7b2a0ff0eae77d1df3338751b3c47a5e759117734a375b8e7f9de80e698b", urls = [
    "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreschola-bold.otf",
    "https://tex.org.uk/fonts/tex-gyre/opentype/texgyreschola-bold.otf",
  ] },
  { name = "texgyreschola-italic.otf", sha256 = "2f45b8c394037951aaec73d947f0b0c3af715950f8f207c9f4290ba37a53a4d2", urls = [
    "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreschola-italic.otf",
    "https://tex.org.uk/fonts/tex-gyre/opentype/texgyreschola-italic.otf",
  ] },
  { name = "texgyreschola-bolditalic.otf", sha256 = "95f085da44c04817771f2a3a754b6eeb442b9a79e79f51dc3b0612e3cc0d75cc", urls = [
    "https://mirrors.ctan.org/fonts/tex-gyre/opentype/texgyreschola-bolditalic.otf",
    "https://tex.org.uk/fonts/tex-gyre/opentype/texgyreschola-bolditalic.otf",
  ] },
]
install = [
  "texgyreschola-regular.otf",
  "texgyreschola-bold.otf",
  "texgyreschola-italic.otf",
  "texgyreschola-bolditalic.otf",
  "GUST-FONT-LICENSE.txt",
]
stage = [
  { from = "texgyreschola-regular.otf", as = "texgyreschola-regular.woff2" },
  { from = "texgyreschola-bold.otf", as = "texgyreschola-bold.woff2" },
  { from = "texgyreschola-italic.otf", as = "texgyreschola-italic.woff2" },
  { from = "texgyreschola-bolditalic.otf", as = "texgyreschola-bolditalic.woff2" },
  "GUST-FONT-LICENSE.txt",
]

