# Vanilla Pandoc only: complete HTML + MathML recipe.
# Quarto uses the `format` map in each source document instead.
from: markdown
to: html5
standalone: true
table-of-contents: true
toc-depth: 3
html-math-method:
  method: mathml
# Rewrites relative `*.md` link targets to the `.html` files this recipe
# writes, matching what Quarto does with the same sources.
filters:
  - ${.}/md-links.lua
css:
  - assets/fonts.css
