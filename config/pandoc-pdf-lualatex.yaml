# Vanilla Pandoc only: complete LuaLaTeX PDF recipe.
# Quarto uses the `format.pdf` map in each source document instead.
from: markdown
to: pdf
standalone: true
table-of-contents: true
toc-depth: 3
pdf-engine: lualatex
# `mermaid.lua` turns each fenced mermaid block into the picture this writer can
# read, and is loaded by all four recipes. `absolute-links.lua` expands
# root-relative link targets against `link-base` below, and only the PDF recipes
# need it: a root-relative target already resolves in HTML.
filters:
  - ${.}/mermaid.lua
  - ${.}/absolute-links.lua
# A defaults file's `metadata:` overrides the document's own front matter
# rather than filling a gap in it, so only what belongs to the recipe goes
# here. The fonts do: they are what this recipe is. `lang` does not -- each
# source declares its own, exactly as it does for Quarto, and pinning it here
# would silently relabel a page written in another language.
metadata:
  # The site these PDFs are published on: see config/absolute-links.lua.
  link-base: https://font.kolen.dev
  mainfont: TeX Gyre Schola
  mathfont: TeX Gyre Schola Math
  monofont: JetBrains Mono
  babelfonts:
    greek: Gentium
    hebrew: Ezra SIL
    # Font filename stem: OSFONTDIR lets fontspec find Regular and Bold files.
    chinese-hant: NotoSansCJKtc
    # Pandoc turns every distinct `lang` into a distinct babel language, so a
    # span overriding a document's `auto-lang` map needs its own entry here
    # even when the face is the same. src/multilingual.md has one.
    chinese-hans: NotoSansCJKtc
