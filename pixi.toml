[workspace]
authors = ["Kolen Cheung <10970208+ickc@users.noreply.github.com>"]
name = "font"
version = "0.1.0"
description = "Reusable font patterns."
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
quarto = "*"
lychee = "*"
pandoc = "*"
python = ">=3.11"
fonttools = "*"
brotli-python = "*"
make = "*"
typst = "*"

[activation]
env = { QUARTO_PORT = "8017" }
scripts = ["scripts/activate.sh"]

[tasks]
download-tex-gyre-schola = { cmd = "python scripts/install_fonts.py tex-gyre-schola", description = "Install TeX Gyre Schola and stage its web fonts" }
download-tex-gyre-schola-math = { cmd = "python scripts/install_fonts.py tex-gyre-schola-math", description = "Install TeX Gyre Schola Math and stage its web font" }
download-noto-cjk-tc = { cmd = "python scripts/install_fonts.py noto-cjk-tc", description = "Install Noto Sans CJK TC (web output uses Google Fonts)" }
download-sbl-greek = { cmd = "python scripts/install_fonts.py sbl-greek", description = "Install and stage the original SBL Greek TTF (accepts SBL EULA)" }
download-sbl-hebrew = { cmd = "python scripts/install_fonts.py sbl-hebrew", description = "Install and stage the original SBL Hebrew TTF (accepts SBL EULA)" }
download-jetbrains-mono = { cmd = "python scripts/install_fonts.py jetbrains-mono", description = "Install JetBrains Mono and stage official WOFF2 files" }
download-fonts = { depends-on = ["download-tex-gyre-schola", "download-tex-gyre-schola-math", "download-noto-cjk-tc", "download-sbl-greek", "download-sbl-hebrew", "download-jetbrains-mono"], description = "Install every desktop font and stage every browser font" }
setup-tex-support = { cmd = "python scripts/install_tex_support.py", description = "Stage selnolig for minimal system TeX Live installations" }

build = { cmd = "python scripts/render_quarto.py", depends-on = ["download-fonts", "setup-tex-support"], description = "Render four Quarto artifacts for each source document" }
serve = { cmd = "quarto preview src --port $QUARTO_PORT --host 0.0.0.0", depends-on = ["download-fonts"], description = "Preview the Quarto site on port QUARTO_PORT" }
clean = { cmd = "make clean", description = "Remove Quarto and vanilla Pandoc output" }

pandoc-build = { cmd = "make all", depends-on = ["download-fonts", "setup-tex-support"], description = "Render four vanilla Pandoc artifacts for each source document" }

linkcheck = { cmd = "lychee --no-ignore --exclude-loopback --exclude '^https://font\\.kolen\\.dev' --exclude '^https://github\\.com/ickc/font$' --max-redirects 10 --root-dir $PIXI_PROJECT_ROOT/src/docs -v src/docs", depends-on = ["build"], description = "Check links in the rendered site via lychee" }
linkcheck-except-429 = { cmd = "lychee --no-ignore --accept '100..=299, 429' --exclude-loopback --exclude '^https://font\\.kolen\\.dev' --exclude '^https://github\\.com/ickc/font$' --max-redirects 10 --root-dir $PIXI_PROJECT_ROOT/src/docs -v src/docs", depends-on = ["build"], description = "Check links via lychee, accepting 429 (too many requests). Primarily for CI." }
