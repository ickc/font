name: CI

on:
  push:
    # Every branch, not just main: a push to any other branch produces a preview
    # deployment at https://<branch>.font-kolen-dev.pages.dev.
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the deploy job widens nothing, it only restates this.
permissions:
  contents: read

# Actions are pinned to commit SHAs rather than tags: a tag can be moved to point at
# new code, and `wrangler-action` runs in the same job as the Cloudflare API token.
# The trailing comment is the human-readable version; Dependabot updates both.

jobs:
  lint:
    name: Formatting
    # Branches in this repository are already covered by the `push` trigger, so the
    # `pull_request` trigger only needs to serve pull requests from forks. Without
    # this, every same-repo PR would build twice.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          locked: true
      # Fails when a Markdown source is not in the canonical form
      # `pixi run format` produces.
      - run: pixi run format-check

  build:
    name: Build and check links
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          locked: true
      # Without a package list this installs the TeX Live infrastructure and
      # nothing else, so `lualatex` is absent and every PDF format fails.
      # .github/tl_packages says what the LuaLaTeX recipes actually read.
      - uses: TeX-Live/setup-texlive-action@eb78d21f41941476d9121e3a0abcab73265c876f # v4.1.1
        with:
          package-file: .github/tl_packages
      - run: pixi run setup
      - run: pixi run build
      # Quarto prints only the first few lines of a LaTeX failure, which is rarely
      # the line that explains it.
      - name: Show the TeX logs
        if: failure()
        run: tail -n 80 src/*.log
      - run: pixi run linkcheck-except-429
      # The Makefile is the other half of the pattern and shares the fonts and
      # TeX installation this job already has, so it is built here too rather
      # than left to be discovered broken by someone copying the repository.
      - run: pixi run pandoc-build
      # Handed to the deploy job so the site is built exactly once.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: src/docs
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    # Two exclusions, both load-bearing:
    #
    #   pull_request — a fork pull request must never reach CLOUDFLARE_API_TOKEN.
    #     That token is account-wide `Cloudflare Pages: Edit`, so it can deploy to
    #     and delete every Pages project in the account, not just this one. Fork
    #     pull requests cannot read environment secrets, so this holds by
    #     construction — but only while deploy stays off the pull_request trigger.
    #
    #   dependabot — GitHub routes Dependabot-triggered runs to a separate secrets
    #     store, so the token would expand to an empty string and every dependency
    #     bump would fail here.
    #
    # Branches in this repository are covered by the `push` trigger, which is what
    # makes previews appear before a pull request is even opened.
    if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
    needs: [lint, build]
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are environment secrets, not
    # repository secrets, so the job has to name the environment to see them. The
    # name is conditional so that `production` can later carry a deployment branch
    # policy restricting it to main without breaking preview deploys.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      # Renders as a clickable "View deployment" button on the run, and as the
      # environment's current URL in the repository sidebar.
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: src/docs
      - id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch decides production vs preview. Passing the branch that is
          # actually being built means main lands as production (the deployment
          # font.kolen.dev serves) and everything else lands as a preview.
          #
          # It has to be passed explicitly: wrangler normally infers the branch
          # from the checked-out repository, but this job only downloads the built
          # artifact and so has no .git to infer from. Left off entirely, every
          # upload — main included — would land as a preview.
          command: >-
            pages deploy src/docs
            --project-name=font-kolen-dev
            --branch=${{ github.ref_name }}
            --commit-dirty=true
      - name: Summarise the deployment
        run: |
          {
            echo "### Deployed \`${{ github.ref_name }}\`"
            echo
            echo "| | URL |"
            echo "|---|---|"
            echo "| Branch (stable) | ${{ steps.deploy.outputs.pages-deployment-alias-url }} |"
            echo "| This deployment | ${{ steps.deploy.outputs.deployment-url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
