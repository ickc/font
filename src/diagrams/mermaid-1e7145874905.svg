2px;font-family:TeX Gyre Schola;font-size:12px;background:hsl(-160, 0%, 93.3333333333%);border:1px solid #707070;border-radius:2px;pointer-events:none;z-index:100;}#mermaid-1e7145874905 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#000000;}#mermaid-1e7145874905 rect.text{fill:none;stroke-width:0;}#mermaid-1e7145874905 .icon-shape,#mermaid-1e7145874905 .image-shape{background-color:white;text-align:center;}#mermaid-1e7145874905 .icon-shape p,#mermaid-1e7145874905 .image-shape p{background-color:white;padding:2px;}#mermaid-1e7145874905 .icon-shape .label rect,#mermaid-1e7145874905 .image-shape .label rect{opacity:0.5;background-color:white;fill:white;}#mermaid-1e7145874905 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#mermaid-1e7145874905 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#mermaid-1e7145874905 .node .neo-node{stroke:#999;}#mermaid-1e7145874905 [data-look="neo"].node rect,#mermaid-1e7145874905 [data-look="neo"].cluster rect,#mermaid-1e7145874905 [data-look="neo"].node polygon{stroke:url(#mermaid-1e7145874905-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-1e7145874905 [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-1e7145874905 [data-look="neo"].node path{stroke:url(#mermaid-1e7145874905-gradient);stroke-width:1px;}#mermaid-1e7145874905 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-1e7145874905 [data-look="neo"].node .neo-line path{stroke:#999;filter:none;}#mermaid-1e7145874905 [data-look="neo"].node circle{stroke:url(#mermaid-1e7145874905-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-1e7145874905 [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-1e7145874905 [data-look="neo"].icon-shape .icon{fill:url(#mermaid-1e7145874905-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-1e7145874905 [data-look="neo"].icon-shape .icon