project:
  type: website
  output-dir: docs
  render:
    - "*.md"
  resources:
    - assets/fonts/**

website:
  title: "Font"
  site-url: "https://font.kolen.dev"
  description: "Reusable multilingual font patterns for Quarto and Pandoc."
  search:
    location: sidebar
    type: textbox
  navbar:
    left:
      - href: index.md
        text: Home
    right:
      - icon: github
        href: https://github.com/ickc/font
        aria-label: GitHub
  page-footer:
    left: "© 2026 Kolen Cheung"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    email-obfuscation: javascript
    html-math-method: mathml
    css: assets/fonts.css

execute:
  freeze: auto
