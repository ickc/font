# Quarto only: vanilla Pandoc uses the root Makefile and config/pandoc-*.yaml.
project:
  type: website
  output-dir: docs
  render:
    - "*.md"
  # LuaLaTeX reads a PDF where every other writer reads the checked-in SVG, and
  # that PDF is derived rather than committed. This is what derives it, and it
  # is a project hook rather than a pixi task so that `quarto preview` and a
  # bare `quarto render` get it too. It needs only typst, and does nothing at
  # all when the PDFs are already current. See scripts/render_diagrams.py.
  pre-render: python ../scripts/render_diagrams.py --pdfs
  resources:
    - assets/**
    - _headers

website:
  title: "Font"
  site-url: "https://font.kolen.dev"
  description: "Reusable multilingual font patterns for Quarto and Pandoc."
  search:
    location: sidebar
    type: textbox
  navbar:
    left:
      - href: index.md
        text: Home
      - href: multilingual.md
        text: Multilingual
      - href: math.md
        text: Mathematics
      - href: mermaid.md
        text: Diagrams
    right:
      - icon: github
        href: https://github.com/ickc/font
        aria-label: GitHub
  page-footer:
    left: "© 2026 Kolen Cheung"

execute:
  freeze: auto
