# Quarto only: vanilla Pandoc configures MathJax in its defaults file.
title: MathJax 4 HTML with TeX Gyre Schola Math
author: Kolen Cheung
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    html:
      html-math-method:
        method: mathjax
        url: https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml-nofont.js
      include-in-header: mathjax-schola.html
