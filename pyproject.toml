# Packaging for the font installer alone, so that another project can depend on
# it (for example pixi's `[pypi-dependencies] font-pattern = { git = ... }`) and
# get the `font-pattern` command. This repository's own tasks run it as
# `python -m font_pattern` from pixi.toml, which is the manifest pixi reads.
[project]
name = "font-pattern"
version = "0.1.0"
description = "Install pinned, checksum-verified desktop fonts, and stage their browser counterparts."
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Kolen Cheung" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only for staging browser fonts that have to be recompressed into WOFF2.
web = ["fonttools", "brotli"]

[project.scripts]
font-pattern = "font_pattern.install:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["font_pattern"]
